<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Quyết Tiến Coffee</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 2rem 5%; }
        .auth-box { background: #fff; padding: 3rem 2rem; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .auth-box h2 { color: var(--primary-color); text-align: center; margin-bottom: 2rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; color: var(--text-dark); font-weight: 500; }
        .input-group input { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 5px; font-family: var(--font-main); }
        .input-group input:focus { outline: none; border-color: var(--accent-color); }
        .btn-full { width: 100%; padding: 1rem; font-size: 1.1rem; }
        .auth-links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .auth-links a { color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="../../index.html" style="text-decoration: none; color: inherit;">Quyết Tiến Coffee</a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="../../index.html">Trang chủ</a></li>
                <li><a href="../info/menu.html">Thực đơn</a></li>
                <li><a href="blog.html">Tin tức</a></li>
                <li><a href="../info/about.html">Về chúng tôi</a></li>
                <li><a href="../info/contact.html">Liên hệ</a></li>
                <li><a href="../shop/cart.html">Giỏ hàng</a></li>
                <li><a href="login.html" style="color: var(--accent-color);">Tài khoản</a></li>
            </ul>
        </nav>
        <div class="menu-toggle"><span></span><span></span><span></span></div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Đăng Nhập Thành Viên</h2>
            <form action="profile.html">
                <div class="input-group">
                    <label for="phone">Số điện thoại / Email</label>
                    <input type="text" id="phone" name="username" placeholder="Nhập số điện thoại của bạn" required>
                </div>
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn-primary btn-full">Đăng Nhập</button>
            </form>
            
            <div class="auth-links">
                <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a> để tích điểm.</p>
                <p style="margin-top: 0.5rem;"><a href="#">Quên mật khẩu?</a></p>
            </div>
        </div>
    </main>

    <footer style="background-color: var(--primary-color); color: var(--text-light); text-align: center; padding: 2rem 5%; margin-top: auto;">
        <p>&copy; 2026 Quyết Tiến Coffee. Đậm đà hương vị nguyên bản.</p>
    </footer>
    <script src="../../assets/js/main.js"></script>
</body>
</html>
