<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quyết Tiến Coffee | Trang Chủ</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">Quyết Tiến Coffee</a></div>
        
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="pages/info/menu.html">Thực đơn</a></li>
                <li><a href="pages/info/about.html">Về chúng tôi</a></li>
                <li><a href="pages/auth/login.html">Đăng nhập</a></li>
            </ul>
        </nav>

        <div class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <section style="text-align: center; padding: 5rem 5%; background-color: var(--primary-color); color: var(--text-light); background-image: linear-gradient(rgba(74, 46, 27, 0.8), rgba(74, 46, 27, 0.9)), url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center;">
        <h1 style="color: var(--accent-color); margin-bottom: 1rem; font-size: 2.5rem;">Đậm đà hương vị nguyên bản</h1>
        <p style="margin-bottom: 2rem;">Khám phá bộ sưu tập Cà phê và Trà mới nhất của chúng tôi.</p>
        <a href="pages/info/menu.html" class="btn-primary">Đặt hàng ngay</a>
    </section>

    <main>
        <h2 style="text-align: center; margin-top: 3rem; color: var(--primary-color);">Sản Phẩm Nổi Bật</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80" alt="Cà Phê Sữa Đá" style="width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 1rem;">
                <h3 style="color: var(--primary-color);">Cà Phê Sữa Đá</h3>
                <p style="color: #666; margin: 0.5rem 0;">45.000 VNĐ</p>
                <button class="btn-primary add-to-cart">Thêm vào giỏ</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=600&q=80" alt="Trà Đào Cam Sả" style="width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 1rem;">
                <h3 style="color: var(--primary-color);">Trà Đào Cam Sả</h3>
                <p style="color: #666; margin: 0.5rem 0;">55.000 VNĐ</p>
                <button class="btn-primary add-to-cart">Thêm vào giỏ</button>
            </div>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
