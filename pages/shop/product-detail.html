<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết món | Quyết Tiến Coffee</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .product-detail-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 3rem auto;
            gap: 3rem;
            padding: 0 5%;
        }
        .product-image {
            flex: 1;
            min-width: 300px;
            border-radius: 15px;
            height: 400px;
            overflow: hidden;
        }
        .product-info {
            flex: 1;
            min-width: 300px;
        }
        .product-price {
            font-size: 1.8rem;
            color: var(--accent-color);
            font-weight: bold;
            margin: 1rem 0;
        }
        .option-group { margin-bottom: 1.5rem; }
        .option-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .radio-options { display: flex; gap: 1rem; flex-wrap: wrap; }
        .radio-options label {
            background: #fff;
            padding: 0.5rem 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .radio-options input[type="radio"], 
        .radio-options input[type="checkbox"] { display: none; }
        .radio-options input:checked + label {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: #fff;
        }
        .action-buttons { display: flex; gap: 1rem; margin-top: 2rem; }
        .quantity-control {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .quantity-control button {
            background: none;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .quantity-control input {
            width: 40px;
            text-align: center;
            border: none;
            font-size: 1rem;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="../../index.html" style="text-decoration: none; color: inherit;">Quyết Tiến Coffee</a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="../../index.html">Trang chủ</a></li>
                <li><a href="cart.html">Giỏ hàng (0)</a></li>
            </ul>
        </nav>
    </header>

    <main class="product-detail-container">
        <div class="product-image">
            <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80" alt="Cà Phê Sữa Đá" style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <div class="product-info">
            <h1 style="color: var(--primary-color);">Cà Phê Sữa Đá</h1>
            <div class="product-price">45.000 VNĐ</div>
            <p style="margin-bottom: 1.5rem; color: #555;">Hương vị cà phê Robusta đậm đà hòa quyện cùng sữa đặc truyền thống, mang lại sự tỉnh táo tức thì.</p>

            <form action="cart.html">
                <div class="option-group">
                    <div class="option-title">Chọn Size</div>
                    <div class="radio-options">
                        <input type="radio" name="size" id="size-s" checked>
                        <label for="size-s">Nhỏ (S)</label>
                        <input type="radio" name="size" id="size-m">
                        <label for="size-m">Vừa (M) +10k</label>
                        <input type="radio" name="size" id="size-l">
                        <label for="size-l">Lớn (L) +15k</label>
                    </div>
                </div>

                <div class="option-group">
                    <div class="option-title">Lượng Đường</div>
                    <div class="radio-options">
                        <input type="radio" name="sugar" id="sugar-100" checked>
                        <label for="sugar-100">100% Đường</label>
                        <input type="radio" name="sugar" id="sugar-50">
                        <label for="sugar-50">50% Đường</label>
                        <input type="radio" name="sugar" id="sugar-0">
                        <label for="sugar-0">Không Đường</label>
                    </div>
                </div>

                <div class="option-group">
                    <div class="option-title">Topping (Thêm hạt)</div>
                    <div class="radio-options">
                        <input type="checkbox" id="top-tranchau">
                        <label for="top-tranchau">Trân châu trắng +10k</label>
                        <input type="checkbox" id="top-kem">
                        <label for="top-kem">Kem Macchiato +15k</label>
                    </div>
                </div>

                <div class="action-buttons">
                    <div class="quantity-control">
                        <button type="button">-</button>
                        <input type="text" value="1" readonly>
                        <button type="button">+</button>
                    </div>
                    <button type="submit" class="btn-primary" style="flex: 1;">Thêm vào giỏ hàng</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
