<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bài viết | Quyết Tiến Coffee</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .blog-detail-container { max-width: 800px; margin: 3rem auto; padding: 0 5%; min-height: 50vh; }
        .blog-detail-img { width: 100%; height: 350px; object-fit: cover; border-radius: 10px; margin-bottom: 1.5rem; }
        .blog-detail-tag { background: var(--accent-color); color: #fff; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 1rem; }
        .blog-detail-back { display: inline-block; margin-top: 1.5rem; color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="/index.html" style="text-decoration: none; color: inherit;">Quyết Tiến Coffee</a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="/index.html">Trang chủ</a></li>
                <li><a href="/pages/info/menu.html">Thực đơn</a></li>
                <li><a href="/pages/auth/blog.html" style="color: var(--accent-color);">Tin tức</a></li>
                <li><a href="/pages/info/about.html">Về chúng tôi</a></li>
                <li><a href="/pages/info/contact.html">Liên hệ</a></li>
                <li><a href="/pages/shop/cart.html">Giỏ hàng <span class="cart-badge">0</span></a></li>
                <li><a href="/pages/auth/login.html">Tài khoản</a></li>
            </ul>
        </nav>
        <div class="menu-toggle"><span></span><span></span><span></span></div>
    </header>

    <main class="blog-detail-container">
        <span class="blog-detail-tag" id="blog-detail-tag">Đang tải...</span>
        <h1 id="blog-detail-title" style="color: var(--primary-color); margin-bottom: 1.5rem;">Đang tải bài viết...</h1>
        <img id="blog-detail-img" class="blog-detail-img" src="" alt="Ảnh bài viết">
        <div id="blog-detail-body"></div>
        <a href="/pages/auth/blog.html" class="blog-detail-back">← Quay lại Blog</a>
    </main>

    <footer style="background-color: var(--primary-color); color: var(--text-light); padding: 3rem 5%; margin-top: auto;">
        <div style="text-align: center; font-size: 0.8rem;">&copy; 2026 Quyết Tiến Coffee. Bảo lưu mọi quyền.</div>
    </footer>

    <script src="../../assets/js/main.js"></script>
</body>
</html>
