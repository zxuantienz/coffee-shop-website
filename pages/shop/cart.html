<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng | Quyết Tiến Coffee</title>
    <!-- Đã sửa đường dẫn CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .cart-container { max-width: 900px; margin: 2rem auto; padding: 0 5%; min-height: 60vh; }
        .cart-table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 10px; overflow: hidden; }
        .cart-table th, .cart-table td { padding: 1.5rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        .cart-table th { background: var(--primary-color); color: #fff; }
        .item-info { display: flex; align-items: center; gap: 1rem; }
        .item-img { width: 60px; height: 60px; border-radius: 5px; object-fit: cover; }
        .cart-summary { margin-top: 2rem; background: #fff; padding: 2rem; border-radius: 10px; text-align: right; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        @media (max-width: 768px) {
            .cart-table thead { display: none; }
            .cart-table, .cart-table tbody, .cart-table tr, .cart-table td { display: block; width: 100%; }
            .cart-table tr { margin-bottom: 1rem; border: 1px solid #eee; }
            .cart-table td { text-align: right; padding-left: 50%; position: relative; }
            .cart-table td::before { content: attr(data-label); position: absolute; left: 1rem; width: 45%; text-align: left; font-weight: bold; }
            .item-info { justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="/index.html" style="text-decoration: none; color: inherit;">Quyết Tiến Coffee</a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="/index.html">Trang chủ</a></li>
                <li><a href="/pages/info/menu.html">Thực đơn</a></li>
                <li><a href="/pages/auth/blog.html">Tin tức</a></li>
                <li><a href="/pages/info/about.html">Về chúng tôi</a></li>
                <li><a href="/pages/info/contact.html">Liên hệ</a></li>
                <li><a href="/pages/shop/cart.html" style="color: var(--accent-color);">Giỏ hàng <span class="cart-badge">0</span></a></li>
                <li><a href="/pages/auth/login.html">Tài khoản</a></li>
            </ul>
        </nav>
        <div class="menu-toggle"><span></span><span></span><span></span></div>
    </header>

    <main class="cart-container">
        <h2 style="color: var(--primary-color); margin-bottom: 1.5rem;">Giỏ Hàng Của Bạn</h2>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody id="cart-items-container">
                <!-- JS SẼ RENDER MÓN ĂN VÀO ĐÂY -->
            </tbody>
        </table>

        <div class="cart-summary">
            <p style="font-size: 1.2rem; margin-bottom: 1rem;">Tổng cộng: <span id="cart-total-price" style="font-size: 1.5rem; color: var(--accent-color); font-weight: bold;">0 VNĐ</span></p>
            <a href="/pages/shop/checkout.html" id="checkout-btn" class="btn-primary" style="font-size: 1.1rem; padding: 0.8rem 2rem;">Tiến hành thanh toán</a>
        </div>
    </main>

    <footer style="background-color: var(--primary-color); color: var(--text-light); padding: 3rem 5%; margin-top: auto;">
        <div style="text-align: center; font-size: 0.8rem;">&copy; 2026 Quyết Tiến Coffee. Bảo lưu mọi quyền.</div>
    </footer>
    
    <!-- Đã sửa đường dẫn JS -->
    <script src="../../assets/js/main.js"></script>
</body>
</html>
