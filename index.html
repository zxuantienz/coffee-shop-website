<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quyết Tiến Coffee | Trang Chủ</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <div class="logo">Quyết Tiến Coffee</div>
        
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="pages/info/menu.html">Thực đơn</a></li>
                <li><a href="pages/info/about.html">Về chúng tôi</a></li>
                <li><a href="pages/auth/login.html">Đăng nhập</a></li>
            </ul>
        </nav>

        <div class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <section style="text-align: center; padding: 4rem 5%; background-color: var(--primary-color); color: var(--text-light);">
        <h1 style="color: var(--accent-color); margin-bottom: 1rem;">Đậm đà hương vị nguyên bản</h1>
        <p style="margin-bottom: 2rem;">Khám phá bộ sưu tập Cà phê và Trà mới nhất của chúng tôi.</p>
        <a href="pages/info/menu.html" class="btn-primary">Đặt hàng ngay</a>
    </section>

    <main>
        <h2 style="text-align: center; margin-top: 3rem; color: var(--primary-color);">Sản Phẩm Nổi Bật</h2>
        <div class="product-grid">
            <div class="product-card">
                <div style="height: 200px; background: #ddd; border-radius: 5px; margin-bottom: 1rem;">[Ảnh Cà phê Sữa]</div>
                <h3 style="color: var(--primary-color);">Cà Phê Sữa Đá</h3>
                <p style="color: #666; margin: 0.5rem 0;">45.000 VNĐ</p>
                <button class="btn-primary add-to-cart">Thêm vào giỏ</button>
            </div>

            <div class="product-card">
                <div style="height: 200px; background: #ddd; border-radius: 5px; margin-bottom: 1rem;">[Ảnh Trà Đào]</div>
                <h3 style="color: var(--primary-color);">Trà Đào Cam Sả</h3>
                <p style="color: #666; margin: 0.5rem 0;">55.000 VNĐ</p>
                <button class="btn-primary add-to-cart">Thêm vào giỏ</button>
            </div>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
