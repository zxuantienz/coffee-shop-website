<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán | Quyết Tiến Coffee</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .checkout-container { display: flex; flex-wrap: wrap; max-width: 1000px; margin: 2rem auto; gap: 2rem; padding: 0 5%; }
        .checkout-form, .order-summary { background: #fff; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex: 1; min-width: 300px; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: var(--text-dark); }
        .form-group input, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; }
        .payment-methods label { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; padding: 1rem; border: 1px solid #eee; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .payment-methods input[type="radio"] { display: none; }
        .payment-methods input:checked + label { border-color: var(--accent-color); background: #fff9f2; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="/index.html" style="text-decoration: none; color: inherit;">Quyết Tiến Coffee</a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="/index.html">Trang chủ</a></li>
                <li><a href="/pages/info/menu.html">Thực đơn</a></li>
                <li><a href="/pages/auth/blog.html">Tin tức</a></li>
                <li><a href="/pages/info/about.html">Về chúng tôi</a></li>
                <li><a href="/pages/info/contact.html">Liên hệ</a></li>
                <li><a href="/pages/shop/cart.html" style="color: var(--accent-color);">Giỏ hàng <span class="cart-badge">0</span></a></li>
                <li><a href="/pages/auth/login.html">Tài khoản</a></li>
            </ul>
        </nav>
        <div class="menu-toggle"><span></span><span></span><span></span></div>
    </header>

    <main class="checkout-container">
        <div class="checkout-form">
            <h2 style="color: var(--primary-color); margin-bottom: 1.5rem;">Thông tin giao hàng</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="fullname">Họ và Tên</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên người nhận" required>
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
                </div>
                <div class="form-group">
                    <label for="address">Địa chỉ nhận hàng</label>
                    <textarea id="address" name="address" rows="3" placeholder="Số nhà, Tên đường, Phường/Xã, Quận/Huyện" required></textarea>
                </div>
                
                <h3 style="color: var(--primary-color); margin: 2rem 0 1rem;">Phương thức thanh toán</h3>
                <div class="payment-methods">
                    <input type="radio" name="payment_method" value="cod" id="pay-cod" checked>
                    <label for="pay-cod">💵 Thanh toán khi nhận hàng (COD)</label>

                    <input type="radio" name="payment_method" value="momo" id="pay-momo">
                    <label for="pay-momo">🟣 Ví MoMo</label>

                    <input type="radio" name="payment_method" value="vnpay" id="pay-vnpay">
                    <label for="pay-vnpay">🔵 VNPay / Thẻ ngân hàng</label>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;">Xác nhận đặt hàng</button>
            </form>
        </div>

        <div class="order-summary">
            <h2 style="color: var(--primary-color); margin-bottom: 1.5rem;">Đơn hàng của bạn</h2>
            <div id="checkout-summary-items" style="border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: #666;">
                <span>Tạm tính</span>
                <span id="checkout-subtotal">0đ</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: #666;">
                <span>Phí vận chuyển</span>
                <span id="checkout-shipping">0đ</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold;">
                <span>Tổng cộng</span>
                <span id="checkout-final-total" style="color: var(--accent-color);">0 VNĐ</span>
            </div>
        </div>
    </main>

    <footer style="background-color: var(--primary-color); color: var(--text-light); padding: 3rem 5%; margin-top: auto;">
        <div style="text-align: center; font-size: 0.8rem;">&copy; 2026 Quyết Tiến Coffee. Bảo lưu mọi quyền.</div>
    </footer>
    
    <script src="../../assets/js/main.js"></script>
</body>
</html>
