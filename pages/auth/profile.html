<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ của tôi | Quyết Tiến Coffee</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 5%;
        }
        .member-card {
            background: linear-gradient(135deg, #FFD700, #DAA520); /* Màu thẻ Vàng */
            border-radius: 15px;
            padding: 2rem;
            color: #fff;
            box-shadow: 0 10px 20px rgba(218, 165, 32, 0.3);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .member-info h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .member-points {
            text-align: right;
        }
        .member-points span {
            font-size: 2rem;
            font-weight: bold;
        }
        .profile-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .menu-item {
            background: #fff;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            color: var(--primary-color);
            font-weight: bold;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Quyết Tiến Coffee</div>
        <nav>
            <ul class="nav-links">
                <li><a href="../../index.html">Trang chủ</a></li>
                <li><a href="../info/menu.html">Thực đơn</a></li>
                <li><a href="#">Đăng xuất</a></li>
            </ul>
        </nav>
    </header>

    <main class="profile-container">
        <h2 style="color: var(--primary-color); margin-bottom: 1.5rem;">Hồ Sơ Thành Viên</h2>
        
        <!-- Thẻ thành viên -->
        <div class="member-card">
            <div class="member-info">
                <h3>Đoàn Xuân Tiến</h3>
                <p>Thành viên: <strong>HẠNG VÀNG</strong></p>
            </div>
            <div class="member-points">
                <p>Điểm tích lũy</p>
                <span>2,450</span>
            </div>
        </div>

        <!-- Menu chức năng Profile -->
        <div class="profile-menu">
            <a href="#" class="menu-item">Thông tin cá nhân</a>
            <a href="history.html" class="menu-item">Lịch sử đơn hàng</a>
            <a href="#" class="menu-item">Ví Voucher của tôi</a>
            <a href="#" class="menu-item">Hỗ trợ & Góp ý</a>
        </div>
    </main>

</body>
</html>
